<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 I Love You 💖</title>

  <!-- React + ReactDOM + Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0033 0%, #3d0066 50%, #660033 100%);
      transition: background 1.5s ease;
    }

    body.active {
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ff6b9d 100%);
    }

    #root {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== START SCREEN ===== */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      animation: fadeIn 1s ease;
    }

    .start-title {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      color: #fff;
      text-shadow: 0 0 30px rgba(255, 107, 157, 0.8);
      animation: float 3s ease-in-out infinite;
    }

    .magic-btn {
      position: relative;
      padding: 20px 60px;
      font-family: 'Poppins', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #ff006e, #ff4d94, #ff006e);
      background-size: 200% 200%;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(255, 0, 110, 0.5),
        inset 0 0 20px rgba(255, 255, 255, 0.2);
      transition: all 0.4s ease;
      animation: gradientShift 3s ease infinite, pulse 2s ease-in-out infinite;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .magic-btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 20px 60px rgba(255, 0, 110, 0.7),
        inset 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .magic-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(45deg);
      animation: shine 3s infinite;
    }

    .hint {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      font-style: italic;
      animation: blink 2s ease-in-out infinite;
    }

    /* ===== LOVE SCREEN ===== */
    .love-screen {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.5s ease;
      z-index: 2;
    }

    .love-text {
      font-family: 'Great Vibes', cursive;
      font-size: 6rem;
      color: #fff;
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.8),
        0 0 40px rgba(255, 107, 157, 0.9),
        0 0 60px rgba(255, 0, 110, 0.7),
        0 5px 15px rgba(0, 0, 0, 0.3);
      margin-bottom: -30px;
      animation: textAppear 2s ease forwards, glow 2s ease-in-out infinite;
      z-index: 10;
      letter-spacing: 3px;
    }

    .big-heart {
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 0 40px rgba(255, 0, 110, 0.8)) drop-shadow(0 0 80px rgba(255, 0, 110, 0.5));
      animation: heartAppear 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards,
        heartbeat 1.2s ease-in-out infinite 1.5s;
      z-index: 10;
    }

    .subtitle {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #fff;
      margin-top: 20px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
      opacity: 0;
      animation: subtitleAppear 1.5s ease 2s forwards;
      z-index: 10;
    }

    /* ===== FALLING HEARTS ===== */
    .heart-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .falling-heart {
      position: absolute;
      top: -50px;
      color: #ff006e;
      opacity: 0.8;
      animation: fall linear forwards;
      filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
    }

    /* ===== SPARKLES ===== */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 20px #ff6b9d;
      animation: sparkle 2s ease-in-out infinite;
      pointer-events: none;
    }

    /* ===== RESET BUTTON ===== */
    .reset-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      padding: 10px 25px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 30px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 100;
      opacity: 0;
      animation: fadeIn 1s ease 3s forwards;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes gradientShift {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%) translateY(-100%) rotate(45deg);
      }

      100% {
        transform: translateX(100%) translateY(100%) rotate(45deg);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes heartAppear {
      0% {
        transform: scale(0) rotate(-180deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.3) rotate(10deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.15);
      }

      30% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.1);
      }

      60% {
        transform: scale(1);
      }
    }

    @keyframes textAppear {
      0% {
        opacity: 0;
        transform: translateY(-50px) scale(0.5);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes subtitleAppear {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {

      0%,
      100% {
        text-shadow:
          0 0 20px rgba(255, 255, 255, 0.8),
          0 0 40px rgba(255, 107, 157, 0.9),
          0 0 60px rgba(255, 0, 110, 0.7);
      }

      50% {
        text-shadow:
          0 0 30px rgba(255, 255, 255, 1),
          0 0 60px rgba(255, 107, 157, 1),
          0 0 90px rgba(255, 0, 110, 0.9);
      }
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes sparkle {

      0%,
      100% {
        opacity: 0;
        transform: scale(0);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      .start-title {
        font-size: 2.5rem;
      }

      .magic-btn {
        padding: 15px 40px;
        font-size: 1rem;
      }

      .love-text {
        font-size: 3.5rem;
      }

      .big-heart {
        width: 180px;
        height: 180px;
      }

      .subtitle {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ===== Heart SVG Component =====
    const Heart = ({ size = 100, color = "#ff006e" }) => (
      <svg viewBox="0 0 24 24" width={size} height={size} fill={color}>
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
             2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
             C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5
             c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    );

    // ===== Falling Hearts Rain =====
    const HeartRain = () => {
      const [hearts, setHearts] = useState([]);

      useEffect(() => {
        const colors = ['#ff006e', '#ff4d94', '#ff6b9d', '#ff8fab', '#ffb3c6', '#ffffff'];
        const sizes = [15, 20, 25, 30, 35, 40];

        const createHeart = () => {
          const newHeart = {
            id: Date.now() + Math.random(),
            left: Math.random() * 100,
            size: sizes[Math.floor(Math.random() * sizes.length)],
            color: colors[Math.floor(Math.random() * colors.length)],
            duration: 4 + Math.random() * 4,
            delay: Math.random() * 2,
          };
          setHearts(prev => [...prev, newHeart]);

          setTimeout(() => {
            setHearts(prev => prev.filter(h => h.id !== newHeart.id));
          }, (newHeart.duration + newHeart.delay) * 1000);
        };

        // Burst of hearts at start
        for (let i = 0; i < 25; i++) {
          setTimeout(createHeart, i * 100);
        }

        // Continuous rain
        const interval = setInterval(createHeart, 250);
        return () => clearInterval(interval);
      }, []);

      return (
        <div className="heart-rain">
          {hearts.map(heart => (
            <div
              key={heart.id}
              className="falling-heart"
              style={{
                left: `${heart.left}%`,
                animationDuration: `${heart.duration}s`,
                animationDelay: `${heart.delay}s`,
              }}
            >
              <Heart size={heart.size} color={heart.color} />
            </div>
          ))}
        </div>
      );
    };

    // ===== Sparkles Effect =====
    const Sparkles = () => {
      const [sparkles, setSparkles] = useState([]);

      useEffect(() => {
        const createSparkle = () => {
          const s = {
            id: Date.now() + Math.random(),
            top: Math.random() * 100,
            left: Math.random() * 100,
            delay: Math.random() * 2,
          };
          setSparkles(prev => [...prev.slice(-30), s]);
        };

        const interval = setInterval(createSparkle, 200);
        return () => clearInterval(interval);
      }, []);

      return (
        <>
          {sparkles.map(s => (
            <div
              key={s.id}
              className="sparkle"
              style={{
                top: `${s.top}%`,
                left: `${s.left}%`,
                animationDelay: `${s.delay}s`,
              }}
            />
          ))}
        </>
      );
    };

    // ===== Start Screen =====
    const StartScreen = ({ onClick }) => (
      <div className="start-screen">
        <h1 className="start-title">A Surprise For You</h1>
        <button className="magic-btn" onClick={onClick}>
          💖 Press Me 💖
        </button>
        <p className="hint">✨ Click the button to see something special ✨</p>
      </div>
    );

    // ===== Love Screen =====
    const LoveScreen = () => (
      <div className="love-screen">
        <HeartRain />
        <Sparkles />
        <h1 className="love-text">I Love You Shrouk 👄</h1>
        <div className="big-heart">
          <Heart size={280} color="#ff006e" />
        </div>
        <p className="subtitle">Forever & Always 💕</p>
      </div>
    );

    // ===== Main App =====
    const App = () => {
      const [started, setStarted] = useState(false);

      const handleStart = () => {
        setStarted(true);
        document.body.classList.add('active');
      };

      const handleReset = () => {
        setStarted(false);
        document.body.classList.remove('active');
      };

      return (
        <>
          {started ? <LoveScreen /> : <StartScreen onClick={handleStart} />}
          {started && (
            <button className="reset-btn" onClick={handleReset}>
              🔄 Start Over
            </button>
          )}
        </>
      );
    };

    // ===== Render =====
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>

</html>
